services:
  db:
    image: postgres:16-alpine
    container_name: sigo_dental_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigo
      POSTGRES_PASSWORD: sigo_dev_2026
      POSTGRES_DB: sigo_dental
    ports:
      - "5433:5432"
    volumes:
      - sigo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigo -d sigo_dental"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sigo_dental_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sigo_redisdata:/data

volumes:
  sigo_pgdata:
  sigo_redisdata:
