# Blueprint de Render para el backend de SIGO-Dental.
# La base de datos PostgreSQL vive en Neon (externa) — ver DEPLOY.md.
services:
  - type: web
    name: sigo-dental-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # npm ci respeta exactamente package-lock.json (reproducible, igual a local).
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      # Node 22.11.0 no soporta cargar modulos ESM via require() (lo que usa
      # @angular-devkit/schematics internamente en 'nest build' para leer
      # magic-string), lo que rompia el build con ERR_REQUIRE_ESM. Se fija
      # una version que si lo soporta (igual a la usada en desarrollo).
      - key: NODE_VERSION
        value: 24.15.0
      - key: PORT
        value: 3000
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: SESSION_IDLE_MINUTES
        value: 15
      - key: SOEP_LOCK_HOURS
        value: 24
      # Definir manualmente en el panel de Render (secretos, no van en este archivo):
      #   DATABASE_URL  -> cadena de conexión de Neon
      #   JWT_SECRET    -> cadena aleatoria larga
      #   CORS_ORIGINS  -> https://<tu-app>.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
